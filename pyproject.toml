[project]
name = "fusionbench"
version = "0.1.0"
description = "Controlled benchmarks for prediction fusion, including matched-distribution and graded validation-to-test transfer scenarios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tabulate>=0.9",
]

[project.optional-dependencies]
lattice = ["networkx>=3.0"]
nsga = ["pymoo>=0.6"]
tpot = ["tpot>=0.12"]
okapi = ["torch>=2.2", "okapi @ git+https://github.com/damiankucharski/OKAPI@0e88dbe762f5fbdf6b8c043aa1aa71908fd1dea8"]
dev = ["pytest>=8.0"]

[project.scripts]
fusionbench = "fusionbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fusionbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
