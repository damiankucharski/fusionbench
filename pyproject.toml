[project]
name = "fusionbench"
version = "0.1.0"
description = "Controlled datasets and extensible, reproducible scenario generators for benchmarking prediction fusion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tabulate>=0.9",
]

[project.optional-dependencies]
lattice = ["networkx>=3.0"]
nsga = ["pymoo>=0.6"]
tpot = ["tpot>=0.12"]
okapi = ["torch>=2.2", "okapi @ git+https://github.com/damiankucharski/OKAPI@5707500fd5cf8b199ce3d1f201e63af8b1dec0f7"]
dev = ["pytest>=8.0"]
docs = ["mkdocs>=1.6,<2"]

[project.scripts]
fusionbench = "fusionbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fusionbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
